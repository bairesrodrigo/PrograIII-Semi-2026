<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - USSS005825</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Módulo de Usuarios (USSS005825)</h2>
            <a href="/login.html" class="btn btn-outline-danger btn-sm"><i
                    class="fa-solid fa-right-from-bracket me-1"></i> Salir</a>
        </div>

        <!-- Formulario de Registro / Edición (Punto 2 y 3) -->
        <div class="card shadow mb-4 p-4">
            <h4 id="formTitulo" class="mb-3 text-success fs-5 fw-bold">Registrar Nuevo Usuario</h4>
            <form id="frmUsuario">
                <input type="hidden" id="idUsuario">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Usuario</label>
                        <input type="text" id="txtUsuario" class="form-control" maxlength="35" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Clave</label>
                        <input type="password" id="txtClave" class="form-control" maxlength="35" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Nombre Completo</label>
                        <input type="text" id="txtNombre" class="form-control" maxlength="85" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Dirección</label>
                        <input type="text" id="txtDireccion" class="form-control" maxlength="100">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Teléfono</label>
                        <input type="text" id="txtTelefono" class="form-control" maxlength="9">
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn btn-secondary d-none" id="btnCancelar"
                        onclick="limpiarForm()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Barra de Búsqueda y Tabla (Punto 4) -->
        <div class="card shadow p-4">
            <div class="input-group mb-3">
                <input type="search" id="txtBuscar" class="form-control" placeholder="Buscar por nombre o usuario...">
                <button class="btn btn-outline-success" type="button" onclick="cargarUsuarios()">Buscar</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tblUsuarios">
                        <!-- Dinámico vía JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarUsuarios();
        });

        // Cargar y Buscar Usuarios (Punto 4)
        async function cargarUsuarios() {
            let filtro = document.getElementById('txtBuscar').value;
            try {
                let res = await fetch(`/api/usuarios?buscar=${encodeURIComponent(filtro)}`);
                let usuarios = await res.json();
                let tbody = document.getElementById('tblUsuarios');
                tbody.innerHTML = "";

                if (usuarios.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">No hay registros encontrados.</td></tr>`;
                    return;
                }

                usuarios.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.idUsuario}</td>
                            <td><strong>${u.usuario}</strong></td>
                            <td>${u.nombre}</td>
                            <td>${u.direccion || 'N/D'}</td>
<td>${u.telefono || 'N/D'}</td>
                            <td class="text-end">
                                <button class="btn btn-outline-primary btn-sm me-1" onclick="editar(${u.idUsuario}, '${u.usuario}', '${u.clave}', '${u.nombre}', '${u.direccion || ''}', '${u.telefono || ''}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-outline-danger btn-sm" onclick="eliminar(${u.idUsuario})"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Error al cargar usuarios:", e);
            }
        }

        document.getElementById('txtBuscar').addEventListener('input', () => {
            cargarUsuarios();
        });

        // Recoger datos y enviar a Python mediante JS Fetch (Punto 2 y 3)
        document.getElementById('frmUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            let idUsuario = document.getElementById('idUsuario').value;
            let datos = {
                accion: idUsuario ? 'actualizar' : 'insertar',
                idUsuario: idUsuario ? parseInt(idUsuario) : null,
                usuario: document.getElementById('txtUsuario').value,
                clave: document.getElementById('txtClave').value,
                nombre: document.getElementById('txtNombre').value,
                direccion: document.getElementById('txtDireccion').value,
                telefono: document.getElementById('txtTelefono').value
            };

            try {
                let res = await fetch('/api/usuarios/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                let resultado = await res.json();

                if (resultado.status === 'ok') {
                    alert(resultado.msg);
                    limpiarForm();
                    cargarUsuarios();
                } else {
                    alert("Error: " + resultado.msg);
                }
            } catch (err) {
                console.error("Error al guardar:", err);
            }
        });

        function editar(id, usuario, clave, nombre, direccion, telefono) {
            document.getElementById('idUsuario').value = id;
            document.getElementById('txtUsuario').value = usuario;
            document.getElementById('txtClave').value = clave;
            document.getElementById('txtNombre').value = nombre;
            document.getElementById('txtDireccion').value = direccion;
            document.getElementById('txtTelefono').value = telefono;

            document.getElementById('formTitulo').innerText = "Editar Usuario (ID: " + id + ")";
            document.getElementById('btnGuardar').innerText = "Actualizar";
            document.getElementById('btnCancelar').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function eliminar(id) {
            if (confirm("¿Está seguro de eliminar este usuario?")) {
                try {
                    let res = await fetch(`/api/usuarios/eliminar/${id}`, { method: 'DELETE' });
                    let resultado = await res.json();
                    if (resultado.status === 'ok') {
                        alert(resultado.msg);
                        cargarUsuarios();
                    } else {
                        alert("Error al eliminar: " + resultado.msg);
                    }
                } catch (e) {
                    console.error("Error al eliminar:", e);
                }
            }
        }

        function limpiarForm() {
            document.getElementById('frmUsuario').reset();
            document.getElementById('idUsuario').value = "";
            document.getElementById('formTitulo').innerText = "Registrar Nuevo Usuario";
            document.getElementById('btnGuardar').innerText = "Guardar";
            document.getElementById('btnCancelar').classList.add('d-none');
        }
    </script>
</body>

</html>
