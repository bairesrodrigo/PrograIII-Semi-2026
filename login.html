<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Académico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 380px;">
        <h3 class="text-center mb-3 text-success">Acceso al Sistema</h3>
        <div id="alertaError" class="alert alert-danger d-none py-2 small"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold small">Usuario</label>
                <input type="text" id="usuario" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Clave</label>
                <input type="password" id="clave" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let usuario = document.getElementById('usuario').value;
            let clave = document.getElementById('clave').value;

            try {
                let res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });
                let resultado = await res.json();

                if (resultado.status === 'ok') {
                    window.location.href = resultado.redirect;
                } else {
                    let alerta = document.getElementById('alertaError');
                    alerta.innerText = resultado.msg;
                    alerta.classList.remove('d-none');
                }
            } catch (err) {
                console.error("Error:", err);
            }
        });
    </script>
</body>

</html>
